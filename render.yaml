services:
  - type: web
    name: cu-lao-gieng
    runtime: node
    plan: free
    buildCommand: "echo no build"
    startCommand: node server.js
    envVars:
      - key: XAI_API_KEY
        sync: false
      - key: GROK_MODEL
        value: grok-4
      - key: KEEP_ALIVE_MINUTES
        value: "10"
    healthCheckPath: /health
