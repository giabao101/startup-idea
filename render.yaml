services:
  - type: web
    name: cu-lao-gieng
    runtime: node
    plan: free
    buildCommand: npm install --omit=dev
    startCommand: node server.js
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: GOOGLE_MAPS_API_KEY
        sync: false
      - key: GOOGLE_MAPS_MAP_ID
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: SHEETS_WEBHOOK_URL
        sync: false
      - key: SHEETS_WEBHOOK_SECRET
        sync: false
      - key: GOOGLE_SHEET_URL
        sync: false
      - key: NODE_VERSION
        value: "22"
      - key: KEEP_ALIVE_MINUTES
        value: "10"
    healthCheckPath: /health
