<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#0e4a47" />
  <title>Cù Lao Giêng</title>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="app.css" />
</head>
<body>
  <!-- Splash -->
  <div id="splash" class="splash">
    <div class="splash-logo" id="splashLogo"></div>
    <h1>Cù Lao Giêng</h1>
    <p id="splashSub">Trợ lý du lịch AI</p>
    <div class="splash-bar"><i></i></div>
  </div>

  <!-- App bar -->
  <header class="appbar" id="appbar">
    <h1 id="appTitle">Khám phá</h1>
    <div class="appbar-actions">
      <button class="icon-btn" id="langBtn" type="button" aria-label="Language"><b>EN</b></button>
      <button class="icon-btn" id="cartBtn" type="button" aria-label="Cart"><span data-ico="cart"></span><span class="badge" id="cartBadge" hidden>0</span></button>
    </div>
  </header>

  <main id="screens">
    <!-- Explore -->
    <section class="screen active" data-screen="explore">
      <div class="hello">
        <h2 id="helloTime"></h2>
        <p class="hello-sub" id="helloTitle"></p>
      </div>
      <button class="ask-bar" type="button" data-tab="ai">
        <span data-ico="sparkles"></span><span id="askBarText"></span>
      </button>
      <div class="season" id="season"></div>

      <div class="sec-head"><h3 data-t="places"></h3></div>
      <div class="carousel" id="placeCarousel"></div>

      <div class="sec-head"><h3 data-t="experiences"></h3><button class="text-btn" type="button" data-tab="stay" data-t="seeAll"></button></div>
      <div class="carousel" id="expCarousel"></div>

      <div class="sec-head"><h3 data-t="nearby"></h3><button class="text-btn" type="button" id="locateBtn" data-t="locate"></button></div>
      <div class="list" id="nearList"></div>
    </section>

    <!-- Map -->
    <section class="screen screen-map" data-screen="map">
      <div id="map"></div>
      <div class="map-chips" id="mapChips"></div>
      <button class="fab" id="fabLocate" type="button" aria-label="Locate"><span data-ico="locate"></span></button>
      <div class="map-sheet" id="mapSheet">
        <div class="grabber"></div>
        <p class="sheet-title" data-t="nearby"></p>
        <div class="list" id="mapList"></div>
      </div>
    </section>

    <!-- AI -->
    <section class="screen screen-ai" data-screen="ai">
      <div class="chat-log" id="chatLog"></div>
      <div class="chat-suggest" id="chatSuggest"></div>
      <form class="chat-bar" id="chatForm">
        <input id="chatInput" autocomplete="off" />
        <button class="send" type="submit" aria-label="Send"><span data-ico="send"></span></button>
      </form>
    </section>

    <!-- Stay / experiences -->
    <section class="screen" data-screen="stay">
      <div class="segmented" data-seg="stay">
        <button class="on" type="button" data-val="exp" data-t="segExp"></button>
        <button type="button" data-val="home" data-t="segHome"></button>
      </div>
      <div class="list" id="stayList"></div>
    </section>

    <!-- Market -->
    <section class="screen" data-screen="market">
      <div class="segmented" data-seg="market">
        <button class="on" type="button" data-val="shop" data-t="segShop"></button>
        <button type="button" data-val="food" data-t="segFood"></button>
        <button type="button" data-val="eat" data-t="segEat"></button>
      </div>
      <div id="marketBody"></div>
    </section>
  </main>

  <!-- Bottom navigation -->
  <nav class="tabbar" id="tabbar">
    <button type="button" data-tab="explore" class="on"><span class="pill"><span data-ico="compass"></span></span><span data-t="tExplore"></span></button>
    <button type="button" data-tab="map"><span class="pill"><span data-ico="map"></span></span><span data-t="tMap"></span></button>
    <button type="button" data-tab="ai"><span class="pill"><span data-ico="sparkles"></span></span><span data-t="tAi"></span></button>
    <button type="button" data-tab="stay"><span class="pill"><span data-ico="leaf"></span></span><span data-t="tStay"></span></button>
    <button type="button" data-tab="market"><span class="pill"><span data-ico="basket"></span></span><span data-t="tMarket"></span></button>
  </nav>

  <!-- Detail page (slides in from right) -->
  <div class="page" id="page" aria-hidden="true">
    <header class="page-bar">
      <button class="icon-btn" id="pageBack" type="button" aria-label="Back"><span data-ico="back"></span></button>
      <p id="pageTitle"></p>
    </header>
    <div class="page-body" id="pageBody"></div>
  </div>

  <!-- Cart bottom sheet -->
  <div class="scrim" id="scrim"></div>
  <div class="sheet" id="cartSheet" aria-hidden="true">
    <div class="grabber"></div>
    <h2 data-t="cart"></h2>
    <div id="cartLines"></div>
    <p class="total"><span data-t="total"></span><b id="cartTotal">0đ</b></p>
    <form class="form" id="orderForm">
      <input name="name" required autocomplete="name" data-ph="fName" />
      <input name="phone" required inputmode="tel" pattern="[0-9+ ]{8,15}" data-ph="fPhone" />
      <input name="address" data-ph="fAddr" />
      <textarea name="note" rows="2" data-ph="fNote"></textarea>
      <button class="btn primary" type="submit" data-t="order"></button>
    </form>
  </div>

  <div class="snackbar" id="snack" role="status"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="icons.js"></script>
  <script src="app.js"></script>
</body>
</html>
